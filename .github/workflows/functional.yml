name: Functional Test

on:
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: localhost:5000/orion-ld-test:latest
  # dds_service_reply_full_roundtrip.test needs Docker + a ROS2 AdditionServer
  # (eprosima/vulcanexus:jazzy-desktop) on the host. GA runners don't expose
  # Docker to the test container, so we skip it in CI only. Local runs
  # (CB_SKIP_FUNC_TESTS unset) execute the test normally - required for
  # merging DDS changes.
  IGNORE_TEST: '0000_ld/dds/dds_service_reply_full_roundtrip.test 0000_ld/dds/dds_service_reply_ddsSync_explicit.test 0000_ld/dds/dds_service_reply_ddsSync_false_override.test'

## Cancel running tests, get faster test-results for the latest commit
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for source or functest changes
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger - running tests"
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get changed files
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          # Check if any src/, test/functionalTest/, workflow, or harness files changed
          if echo "$CHANGED" | grep -qE '^(src/|test/functionalTest/|\.github/workflows/functional\.yml)'; then
            echo "Source, functional test, or workflow changes detected - running tests"
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "::notice::Skipping functional tests - no changes in src/, test/functionalTest/, or workflow"
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  build-test-image:
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.should_run == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          file: docker/Dockerfile-test
          tags: ${{ env.IMAGE_NAME }}
          outputs: type=docker,dest=/tmp/test-image.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-image
          path: /tmp/test-image.tar

  test:
    runs-on: ubuntu-latest
    needs: [check-changes, build-test-image]
    if: needs.check-changes.outputs.should_run == 'true'
    services:
      mosquitto:
        image: eclipse-mosquitto:1.6
        ports:
          - 1883:1883
          - 9001:9001
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
      # Currently not used as functional test is started with "d" flag that results in locally started mongodb
      # mongodb:
      #   image: mongo:4.4
      #   ports:
      #     - 27017:27017
      context-server:
        image: wistefan/context-server:0.2.0
        env:
          MEMORY_ENABLED: true
        ports:
          - 7080:8080

    strategy:
      fail-fast: false
      #max-parallel: 1
      matrix:
        test: [ 'functional_0_501','functional_502_876', 'functional_877_1221', 'functional_1222_end' ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: test-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load --input /tmp/test-image.tar

      - name: Start MQTTS broker
        run: |
          sudo apt-get install -y mosquitto openssl
          mkdir -p /tmp/mosquitto-mqtts
          # Generate self-signed certs for MQTTS testing
          openssl req -new -x509 -days 30 -nodes \
            -keyout /tmp/mosquitto-mqtts/ca.key -out /tmp/mosquitto-mqtts/ca.crt \
            -subj "/CN=MQTT Test CA" 2>/dev/null
          openssl genrsa -out /tmp/mosquitto-mqtts/server.key 2048 2>/dev/null
          openssl req -new -key /tmp/mosquitto-mqtts/server.key \
            -out /tmp/mosquitto-mqtts/server.csr -subj "/CN=localhost" 2>/dev/null
          openssl x509 -req -days 30 \
            -in /tmp/mosquitto-mqtts/server.csr \
            -CA /tmp/mosquitto-mqtts/ca.crt -CAkey /tmp/mosquitto-mqtts/ca.key \
            -CAcreateserial -out /tmp/mosquitto-mqtts/server.crt 2>/dev/null
          chmod 644 /tmp/mosquitto-mqtts/*
          cat > /tmp/mosquitto-mqtts.conf << EOF
          listener 8883
          cafile /tmp/mosquitto-mqtts/ca.crt
          certfile /tmp/mosquitto-mqtts/server.crt
          keyfile /tmp/mosquitto-mqtts/server.key
          allow_anonymous true
          EOF
          mosquitto -c /tmp/mosquitto-mqtts.conf -d
          sleep 0.5

      - name: Run functional test
        run: |
          docker run --rm --network host -v $(pwd):/opt/orion -v /tmp/mosquitto-mqtts:/tmp/mosquitto-mqtts -e CB_FT_VERBOSE=true -e CB_SKIP_FUNC_TESTS='${{ env.IGNORE_TEST}}' -e ORIONLD_CORE_CONTEXT_DIR=/opt/orion/ldcontexts -e CB_FT_VERBOSE=ON ${{ env.IMAGE_NAME }} -s ${{ matrix.test }} -dqt
