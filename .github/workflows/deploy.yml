name: Deploy

on:
  push:
    branches:
      - develop

env:
  IMAGE_ORG: fiware
  IMAGE_NAME: orion-ld
  IMAGE_TAG_LATEST:  latest
  IMAGE_TAG_DEBUG: debug
  IMAGE_TAG_PRE: 1.13.0-PRE-${{ github.run_number }}

jobs:

  # push to dockerhub
  deploy-release-dockerhub:

    runs-on: ubuntu-latest
    if: ${{ github.repository == 'FIWARE/context.Orion-LD' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: |
            ${{ env.IMAGE_ORG }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG_LATEST }}
            ${{ env.IMAGE_ORG }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG_PRE }}
          file: docker/Dockerfile-ubi
          no-cache: true

      - name: Build and push with gdb
        id: docker_build_gdb
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: |
            ${{ env.IMAGE_ORG }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG_PRE }}-GDB
          build-args: |
            BASE_IMAGE=${{ env.IMAGE_ORG }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG_PRE }}
          file: docker/Dockerfile-gdb
          no-cache: true


      - name: Run Snyk to check Docker image for vulnerabilities
        uses: snyk/actions/docker@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ env.IMAGE_ORG }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG_PRE }}
          args: --file=docker/Dockerfile-ubi

      - name: Upload result to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif

  deploy-debug-dockerhub:

    runs-on: ubuntu-latest
    if: ${{ github.repository == 'FIWARE/context.Orion-LD' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ env.IMAGE_ORG }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG_PRE }}-${{ env.IMAGE_TAG_DEBUG }}
          file: docker/Dockerfile-debug
          no-cache: true

  # quay.io

  deploy-release-quay:

    runs-on: ubuntu-latest
    if: ${{ github.repository == 'FIWARE/context.Orion-LD' }}

    steps:
      - uses: actions/checkout@v4

      - name: Build Image
        id: build-image
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.IMAGE_ORG }}/${{ env.IMAGE_NAME }}
          oci: true
          labels: |
            quay.expires-after=1w
          tags: ${{ env.IMAGE_TAG_LATEST }} ${{ env.IMAGE_TAG_PRE }} ${{ github.sha }}
          dockerfiles: |
            ./docker/Dockerfile-ubi

      - name: Push To quay.io
        id: push-to-quay
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build GDB image from local storage
        run: |
          # Build GDB layer directly on the local image using buildah
          # This avoids pulling from quay.io which has manifest propagation delays
          echo "=== Local images ==="
          buildah images
          # buildah-build stores tags lowercased and under localhost/ prefix
          LOCAL_TAG=$(echo "${{ env.IMAGE_TAG_PRE }}" | tr '[:upper:]' '[:lower:]')
          CONTAINER=$(buildah from --pull-never localhost/${{ steps.build-image.outputs.image }}:${LOCAL_TAG})
          buildah copy $CONTAINER ./docker/debug/gdbinit /gdbinit
          buildah run $CONTAINER yum -y install gdb
          buildah config --entrypoint '["gdb", "-x", "/gdbinit", "--args", "orionld", "-fg", "-multiservice", "-ngsiv1Autocast"]' $CONTAINER
          buildah config --port 1026 $CONTAINER
          buildah config --label quay.expires-after=1w $CONTAINER
          buildah commit --format oci $CONTAINER ${{ env.IMAGE_ORG }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG_PRE }}-GDB
          buildah rm $CONTAINER
          echo "=== GDB image built ==="
          buildah images | grep GDB

      - name: Push GDB To quay.io
        id: push-gdb-to-quay
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ env.IMAGE_ORG }}/${{ env.IMAGE_NAME }}
          tags: ${{ env.IMAGE_TAG_PRE }}-GDB
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}


  deploy-debug-quay:

    runs-on: ubuntu-latest
    if: ${{ github.repository == 'FIWARE/context.Orion-LD' }}

    steps:
      - uses: actions/checkout@v4

      - name: Build Image
        id: build-image
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.IMAGE_ORG }}/${{ env.IMAGE_NAME }}
          tags: ${{ env.IMAGE_TAG_PRE }}-${{ env.IMAGE_TAG_DEBUG }}
          oci: true
          labels: |
            quay.expires-after=1w
          dockerfiles: |
            ./docker/Dockerfile-debug

      - name: Push To quay.io
        id: push-debug-to-quay
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
