name: Mintaka compatibility

on:
  pull_request:

jobs:
  mintaka-compatibility:
    runs-on: ubuntu-latest

    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000

    steps:
      - uses: actions/checkout@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
        with:
          driver-opts: network=host

      - name: Build and push to local registry
        uses: docker/build-push-action@v2
        with:
          push: true
          file: docker/Dockerfile-ubi
          tags: localhost:5000/orion-ld:latest

      - name: Save context file for later
        run: cp test/functionalTest/contexts/schema_lab_fiware_org_ld_context.jsonld /tmp/context.jsonld

      - uses: actions/checkout@v2
        with:
          repository: fiware/mintaka

      - name: Set up context server
        run: |
          # Add hosts entry so schema.lab.fiware.org resolves to localhost
          echo "127.0.0.1 schema.lab.fiware.org" | sudo tee -a /etc/hosts
          # Serve the context file on port 80 at /ld/context
          mkdir -p /tmp/context-root/ld
          cp /tmp/context.jsonld /tmp/context-root/ld/context
          cd /tmp/context-root && sudo python3 -m http.server 80 &
          # Wait for server to be ready
          sleep 2
          # Verify it works
          curl -s http://schema.lab.fiware.org/ld/context

      - uses: actions/setup-java@v1
        with:
          java-version: '17'
          java-package: jdk

      - name: Run tests
        run: mvn clean test
        env:
          ORION_IMAGE: localhost:5000/orion-ld:latest
