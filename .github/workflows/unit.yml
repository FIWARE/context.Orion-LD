name: Unit Test

on:
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: localhost:5000/orion-ld-test:latest

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Check for source or unittest changes
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger - running tests"
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get changed files
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          # Check if any src/ or test/unittests/ files changed
          if echo "$CHANGED" | grep -qE '^(src/|test/unittests/)'; then
            echo "Source or unit test changes detected - running tests"
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "::notice::Skipping unit tests - no changes in src/ or test/unittests/"
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  unit:
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.should_run == 'true'

    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
      mongodb:
        image: mongo:4.4
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
        with:
          driver-opts: network=host

      - name: Build and push to local registry
        uses: docker/build-push-action@v2
        with:
          push: true
          file: docker/Dockerfile-test
          tags: localhost:5000/orion-ld-test:latest

      - name: Run unit test
        run: |
          docker run --rm -v $(pwd):/opt/orion -e CB_FT_VERBOSE=true -e ORIONLD_CACHED_CONTEXT_DIRECTORY=/opt/orion/ldcontexts -e CB_FT_VERBOSE=ON localhost:5000/orion-ld-test:latest -s unit -dqt
